name: 'Deployment (Prod - New Bucket)'
on:
  #push:
  #  branches:
  #    - 'prod'
  workflow_dispatch:

jobs:
  Docusaurus:
    name: 'Deployment'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          
      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@master
        with:
          find: ${{ secrets.CDN_URL }}
          replace: ${{ secrets.PROD_WEBSITE_URL }}
          
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          
      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@master
        with:
          find: "indexName: '${{ secrets.STAGE_INDEX }}',"
          replace: "indexName: '${{ secrets.PROD_INDEX }}',"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_MKT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_MKT }}
          aws-region: us-east-1

      - name: 'Create env file'
        run: |
          touch .env
          echo "HOST=${{ secrets.TYPESENSE_HOST }}" >> .env
          echo "API=${{ secrets.PUBLIC_APY_TYPESENSE }}" >> .env
          
      - name: Use Node.js 20.10.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.10.x
      
      - run: npm install --legacy-peer-deps && npm run build
        env:
          CI: false

      - name: Copy files to S3 with the AWS CLI
        run: |
          cp -R assets/ build/
          cd build/
          aws s3 sync . s3://lambdatest-prod-docs/support/ --exclude 'robots.txt' --delete

      - name: Invalidate Cloudfront
        run : |
          aws cloudfront create-invalidation --distribution-id EEMGB6PM4ZZ7A  --paths "/support/*"
          sleep 90
          
      # Cloudflare has refused the Global API Key (X-Auth-Email/X-Auth-Key) since Oct 2026.
      # Purge with an API token that has Cache Purge permission on the zone,
      # and fail the run unless Cloudflare reports success: curl alone ignores
      # the reply, which is how a failing purge stayed green.
      - name: Cloudflare Invalidation
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_WEBSITE_URL: ${{ secrets.PROD_WEBSITE_URL }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ZONE_ID CLOUDFLARE_API_TOKEN PROD_WEBSITE_URL; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is not set for this workflow."; exit 1; }
          done
          RESPONSE=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg host "$PROD_WEBSITE_URL" '{hosts: [$host]}')")
          echo "$RESPONSE"
          jq -e '.success == true' <<<"$RESPONSE" > /dev/null ||
            { echo "::error::Cloudflare did not purge the cache (reply above)."; exit 1; }
          sleep 60
