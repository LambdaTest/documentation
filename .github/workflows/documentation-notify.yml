# Runs after every successful production deploy of testmuCom and tells the
# downstream indexes which commit is now live.
#
#   1. docs-retrieval-service (TE-28101): an HMAC-signed POST /v1/index with the
#      deployed commit sha. The service downloads that commit, diffs it against
#      what it has indexed and updates the search index in the background.
#   2. product-context: the same `documentation-updated` repository_dispatch the
#      stage-branch copy of this workflow sends, now fired from the prod deploy
#      so it re-crawls what is actually live.
#
# Why workflow_run and not push: a push fires before the site is built and
# uploaded, so an indexer triggered by it would read pages that are not live
# yet. workflow_run waits for the deploy to finish, and the `if` below skips
# failed or cancelled deploys.
#
# workflow_run only fires for a workflow file on the default branch
# (testmuCom), so this file must be merged there.
#
# One-time setup (Settings, Secrets and variables, Actions):
#   Secret   DOCS_RETRIEVAL_DISPATCH_TOKEN  same value as INDEX_DISPATCH_HMAC on the service
#   Variable DOCS_RETRIEVAL_URL             service base URL, no trailing slash
#   Secret   PRODUCT_CONTEXT_DISPATCH_TOKEN token with dispatch rights on product-context
#
# Manual run: Actions, "Notify indexes after prod deploy", Run workflow, with the
# 40-character sha of a commit that is already deployed.
name: Notify indexes after prod deploy

on:
  workflow_run:
    workflows: ['Deployment (Prod - testmucom New Bucket)']
    types: [completed]
    branches: [testmuCom]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Deployed commit sha (40 hex characters)'
        required: true
      products:
        description: 'product-context products to re-crawl (comma separated, or all)'
        required: false
        default: 'all'

permissions:
  contents: read
  actions: read

concurrency:
  group: notify-indexes-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

env:
  DISPATCH_REPO: LambdatestIncPrivate/product-context

jobs:
  docs-retrieval-index:
    name: 'docs-retrieval-service: index deployed commit'
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Signed POST /v1/index
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          HMAC_SECRET: ${{ secrets.DOCS_RETRIEVAL_DISPATCH_TOKEN }}
          BASE_URL: ${{ vars.DOCS_RETRIEVAL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HMAC_SECRET}" ] || [ -z "${BASE_URL}" ]; then
            echo "::error::DOCS_RETRIEVAL_DISPATCH_TOKEN secret or DOCS_RETRIEVAL_URL variable is not set."
            exit 1
          fi
          if ! printf '%s' "${SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be 40 lowercase hex characters, got '${SHA}'."
            exit 1
          fi

          attempt=0
          max_attempts=6
          delay=15
          while :; do
            attempt=$((attempt + 1))
            # Sign the exact bytes that are sent. The timestamp is fresh on every
            # attempt because the service rejects a ts more than 5 minutes old.
            printf '{"sha":"%s","ts":%s,"trigger":"deploy"}' "${SHA}" "$(date +%s)" > body.json
            sig=$(openssl dgst -sha256 -hmac "${HMAC_SECRET}" -r body.json | cut -d' ' -f1)
            status=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 30 \
              -X POST "${BASE_URL}/v1/index" \
              -H 'Content-Type: application/json' \
              -H "X-Signature-256: sha256=${sig}" \
              --data-binary @body.json || echo 000)
            echo "attempt ${attempt}: HTTP ${status}"
            cat response.json 2>/dev/null || true
            echo

            case "${status}" in
              200|202)
                echo "Index run accepted for ${SHA}."
                exit 0
                ;;
              400|401|403|404|413)
                echo "::error::docs-retrieval-service refused the request (HTTP ${status}); retrying will not help."
                exit 1
                ;;
              409|429|5*|000)
                # 409: another index run is in progress. The nightly reconcile
                # also catches up, but retry so this deploy is indexed promptly.
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "::error::Giving up after ${attempt} attempts (last HTTP ${status})."
                  exit 1
                fi
                echo "Retrying in ${delay}s."
                sleep "${delay}"
                delay=$((delay * 2))
                ;;
              *)
                echo "::error::Unexpected HTTP ${status}."
                exit 1
                ;;
            esac
          done

  product-context:
    name: 'product-context: re-crawl changed products'
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight, ensure dispatch token is present
        env:
          DISPATCH_TOKEN: ${{ secrets.PRODUCT_CONTEXT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Secret PRODUCT_CONTEXT_DISPATCH_TOKEN is empty for this run."
            exit 1
          fi

      - name: Checkout (for changed-file detection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0

      - name: Derive changed product areas
        id: products
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          MANUAL_PRODUCTS: ${{ inputs.products }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${MANUAL_PRODUCTS:-all}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A deploy can ship several commits, so diff against the commit the
          # previous successful prod deploy shipped, not only the tip commit.
          BEFORE=$(gh api "repos/${{ github.repository }}/actions/workflows/testmucom-prod-deployment.yml/runs?branch=testmuCom&status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID})][0].head_sha" 2>/dev/null || true)
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "null" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          else
            FILES=$(git show --name-only --pretty=format: "$AFTER" || true)
          fi
          echo "Changed files:"; echo "$FILES"

          PRODUCTS=""
          add() { case ",$PRODUCTS," in *",$1,"*) ;; *) PRODUCTS="${PRODUCTS:+$PRODUCTS,}$1";; esac; }

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *kaneai*|*kane-ai*)                          add "KaneAI" ;;
              *test-manager*|*test-management*)            add "Test Manager" ;;
              *hyperexecute*)                              add "HyperExecute" ;;
              *smartui*|*smart-ui*|*visual-regression*)    add "SmartUI" ;;
              *insights*|*dashboard*|*analytics*|*widget*) add "Insights" ;;
              *accessibility*)                             add "Accessibility Testing" ;;
              *agent-to-agent*|*a2a*)                      add "Agent To Agent" ;;
              *real-time*|*realtime*)                      add "Real Time" ;;
              *real-device*)                               add "Real Device" ;;
              *appium*|*virtual-device*|*app-automation*)  add "App Automation" ;;
              *cypress*|*playwright*|*puppeteer*|*web-automation*) add "Web Automation" ;;
              *scanner*)                                   add "Web Scanner" ;;
              *tunnel*|*local*)                            add "Testing Locally" ;;
              *sso*|*scim*|*security*|*settings*)          add "Settings and Security" ;;
              *integration*|*ci-cd*)                       add "Integrations" ;;
            esac
          done <<< "$FILES"

          [ -z "$PRODUCTS" ] && PRODUCTS="all"
          echo "Mapped products: $PRODUCTS"
          echo "list=$PRODUCTS" >> "$GITHUB_OUTPUT"

      - name: Dispatch to product-context
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRODUCT_CONTEXT_DISPATCH_TOKEN }}
          repository: ${{ env.DISPATCH_REPO }}
          event-type: documentation-updated
          client-payload: |
            {
              "products": "${{ steps.products.outputs.list }}",
              "source_commit": "${{ github.event.workflow_run.head_sha || inputs.sha }}",
              "pusher": "${{ github.event.workflow_run.actor.login || github.actor }}",
              "branch": "testmuCom"
            }
