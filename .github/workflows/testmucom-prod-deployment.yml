name: 'Deployment (Prod - testmucom New Bucket)'

on:
  push:
    branches:
      - testmuCom

jobs:
  Docusaurus:
    name: 'Deployment'
    runs-on: ubuntu-latest
  

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testmuCom
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_MKT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_MKT }}
          aws-region: us-east-1

      - name: 'Create env file'
        run: |
          touch .env
          echo "HOST=${{ secrets.TYPESENSE_HOST }}" >> .env
          echo "API=${{ secrets.PUBLIC_APY_TYPESENSE }}" >> .env
          echo "TYPESENSE_COLLECTION_NAME=testmuai" >> .env

     

      - name: Use Node.js 20.10.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.10.x

      - name: Install dependencies and build
        run: npm install --legacy-peer-deps && npm run build
        env:
          CI: false

      - name: Copy files to S3 with AWS CLI
        run: |
          cp -R assets/ build/
          cd build/
          # Upload this build's hashed bundles FIRST, without --delete, so old
          # bundles stay in place (old HTML still referencing them keeps working)
          # and this build's new hashes exist in S3 before any HTML that
          # references them can possibly go live. Doing this second would open a
          # window where new HTML is already live but its bundle isn't uploaded
          # yet, causing a 404 that CDNs/browsers can then cache for hours.
          aws s3 sync . s3://lambdatest-prod-support-docs-testmucom/support/ --exclude '*' --include 'assets/js/*' --include 'assets/css/*'
          # Then sync everything else (HTML etc.), deleting anything that no
          # longer exists in this build, but never touching the hashed asset
          # dirs so previously deployed bundles are never removed.
          aws s3 sync . s3://lambdatest-prod-support-docs-testmucom/support/ --exclude 'robots.txt' --exclude 'assets/js/*' --exclude 'assets/css/*' --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GY6CDKYL9RFL \
            --paths "/support/*"
          sleep 90

      # Cloudflare purges go through the org's central cf-purge.yml in
      # LambdatestIncPrivate/lambda-deployment-manager, which holds the only
      # Cloudflare token. The direct API call this step used to make fails with code 7003 (no zone id), and the step stayed green because curl ignored the reply.
      # Needs the LT_USER_ACCESS_TOKEN_APP_ID variable and the
      # LT_USER_ACCESS_TOKEN_PRIVATE_KEY secret; a failed purge fails the run.
      - name: Mint a token for the central Cloudflare purge
        id: cf-purge-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LT_USER_ACCESS_TOKEN_APP_ID }}
          private-key: ${{ secrets.LT_USER_ACCESS_TOKEN_PRIVATE_KEY }}
          owner: LambdatestIncPrivate
          repositories: lambda-deployment-manager
          permission-actions: write

      - name: Purge Cloudflare (lambda-deployment-manager cf-purge.yml)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.cf-purge-token.outputs.token }}
          CF_ZONE: testmuai.com
          CF_PREFIXES: www.testmuai.com/support/
          CALLER: documentation-${{ github.run_id }}-${{ github.run_attempt }}-testmucom
        run: |
          set -euo pipefail
          REPO=LambdatestIncPrivate/lambda-deployment-manager
          SINCE=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run cf-purge.yml --repo "$REPO" --ref main \
            -f zone="$CF_ZONE" -f prefixes="$CF_PREFIXES" -f caller="$CALLER"
          # A dispatch returns no run id; cf-purge.yml names its run "cf-purge · <caller> · <zone>".
          RUN_ID=''
          for _ in $(seq 1 24); do
            sleep 5
            RUN_ID=$(gh run list --repo "$REPO" --workflow cf-purge.yml --event workflow_dispatch \
              --created ">=$SINCE" --limit 100 --json databaseId,displayTitle \
              --jq "[.[] | select(.displayTitle | contains(\" · $CALLER · \"))][0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No cf-purge.yml run for $CALLER appeared within 2 minutes."
            exit 1
          fi
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          echo "Central purge: $RUN_URL"
          # Cloudflare's reply is in the central run's log, not here.
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status > /dev/null ||
            { echo "::error::Cloudflare purge did not succeed: $RUN_URL"; exit 1; }
