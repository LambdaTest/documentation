          title: Wait Seconds
          description: How long to wait (in seconds) after detecting speech end before responding. Increase
            for agents that speak multiple sentences in one turn. Default is 2.0 seconds.
          type: number
          maximum: 5.0
          minimum: 0.5
          nullable: true
        max_duration_seconds:
          title: Max Duration Seconds
          description: Maximum call duration in seconds (60-3600). Defaults to 500 if not set.
          type: integer
          maximum: 3600.0
          minimum: 60.0
          nullable: true
        silence_timeout_seconds:
          title: Silence Timeout Seconds
          description: Whole-call silence cap in seconds (30-180). The call is ended if neither party
            speaks for this long. Defaults to 30s if not set.
          type: integer
          maximum: 180.0
          minimum: 30.0
          nullable: true
        iterations:
          title: Iterations
          description: Per-combination repeat count for matrix runs. Total calls for this scenario = voices.length
            * max(background_noises.length, 1) * iterations. When unset, behaves as iterations=1 (each
            combination dialed once).
          type: integer
          maximum: 10.0
          minimum: 1.0
          nullable: true
        voices:
          title: Voices
          description: Matrix voices for this scenario. Required (>=1) when iterations or background_noises
            is set. Each voice is dialed against every selected background noise (or, if no noises selected,
            against the existing background-sound resolution chain). Capped at 20 to bound matrix expansion.
          items:
            $ref: '#/components/schemas/VoiceRef'
          type: array
          maxItems: 20
          nullable: true
        background_noises:
          title: Background Noises
          description: Matrix background-noise labels, as shown in the product UI's background-noise selector.
            Empty/missing leaves background-sound resolution to the existing chain (agent_profile.background_noise
            > scenario.background_sound_url > silence). Capped at 20 to bound matrix expansion.
          items:
            type: string
          type: array
          maxItems: 20
          nullable: true
        personas:
          title: Personas
          description: Matrix persona types for this scenario. Independent matrix axis — does not require
            voices. Each persona resolves to a pre-generated, fully-infused prompt variant; the scenario's
            baked persona maps to the original prompt. Total calls = personas.length (or 1) * voices.length
            (or 1) * max(background_noises.length, 1) * iterations. Capped at 20 to bound matrix expansion.
          items:
            type: string
          type: array
          maxItems: 20
          nullable: true
        test_profile_ids:
          title: Test Profile Ids
          description: Matrix test-profile IDs for this scenario (phone caller inbound only). Independent
            matrix axis — does not require voices. Each ID resolves a TestProfile whose data is injected
            into the prompt at dial time; duplicates are rejected (use `iterations` to repeat the same
            profile). Total calls = max(personas, 1) * max(test_profile_ids, 1) * max(voices, 1) * max(background_noises,
            1) * iterations. A non-empty list wins over the entire resolution chain (scenario.test_profile_id,
            suite.test_profile_id, request.test_profile_id, project default). Empty list or missing field
            falls through to that chain unchanged — fully backward compatible. Capped at 10 to bound matrix
            expansion.
          items:
            type: string
          type: array
          maxItems: 10
          nullable: true
        region:
          title: Region
          description: Inbound region override for this scenario (e.g. 'us', 'eu'). Overrides the suite-level
            region; null inherits.
          type: string
          nullable: true
