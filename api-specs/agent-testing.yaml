      description: 'Return Tier 1 metrics bucketed by concurrency.


        For terminal runs the result is served from a cached summary;

        pass ``refresh=true`` to recompute from the underlying call

        records.'
      operationId: get_performance_test_summary_api_performance_tests__run_id__summary_get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Force a rebuild even if a cached summary exists.
          default: false
          title: Refresh
        description: Force a rebuild even if a cached summary exists.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceTestSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/performance-tests/{run_id}/abort:
    post:
      tags:
      - Performance Testing
      summary: Abort Performance Test
      description: 'Stop dispatching new batches AND end live calls.


        Dispatching stops promptly, and every call still in-flight on this

        run is asked to end via the telephony provider so

        accidentally-triggered calls don''t run to completion. Provider-side

        termination is best-effort: calls that can''t be ended (already

        ended, not yet connected) are cleaned up by a background job within

        a few minutes. The org concurrency cap is restored as soon as the

        run finishes shutting down.'
      operationId: abort_performance_test_api_performance_tests__run_id__abort_post
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceTestRunSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
