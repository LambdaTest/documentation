          description: Background sound enabled for this scenario
          type: boolean
          nullable: true
        background_sound_url:
          title: Background Sound Url
          description: Background sound URL for this scenario
          type: string
          nullable: true
        first_speaker:
          title: First Speaker
          description: 'Who speaks first: ''simulator'' (default) or ''actual_bot'''
          type: string
          nullable: true
        caller_profile_id:
          title: Caller Profile Id
          description: Caller profile ID for outbound calls
          type: string
          nullable: true
        wait_seconds:
          title: Wait Seconds
          description: How long to wait (in seconds) after detecting speech end before responding. Increase
            for agents that speak multiple sentences in one turn. Default is 2.0 seconds.
          type: number
          maximum: 5.0
          minimum: 0.5
          nullable: true
        max_duration_seconds:
          title: Max Duration Seconds
          description: Maximum call duration in seconds (60-3600). Defaults to 500 if not set.
          type: integer
          maximum: 3600.0
          minimum: 60.0
          nullable: true
        silence_timeout_seconds:
          title: Silence Timeout Seconds
          description: Whole-call silence cap in seconds (30-180). The call is ended if neither party
            speaks for this long. Defaults to 30s if not set.
          type: integer
          maximum: 180.0
          minimum: 30.0
          nullable: true
        iterations:
          title: Iterations
          description: Per-combination repeat count for matrix runs. Total calls = voices.length * max(background_noises.length,
            1) * iterations. Unset behaves as 1.
          type: integer
          maximum: 10.0
          minimum: 1.0
          nullable: true
        voices:
          title: Voices
          description: Matrix voices for this scenario. Required (>=1) when iterations or background_noises
            is set.
          items:
            $ref: '#/components/schemas/VoiceRef'
          type: array
          nullable: true
        background_noises:
          title: Background Noises
          description: Matrix background-noise labels from the server-side registry. Empty/missing leaves
            background-sound resolution to the existing chain.
          items:
            type: string
          type: array
          nullable: true
        personas:
          title: Personas
          description: Matrix persona types for this scenario. Independent matrix axis — does not require
            voices. Each persona resolves to a pre-generated, fully-infused prompt variant; the scenario's
            baked persona maps to the original prompt. Total calls = personas.length (or 1) * voices.length
            (or 1) * max(background_noises.length, 1) * iterations.
          items:
            type: string
          type: array
          nullable: true
