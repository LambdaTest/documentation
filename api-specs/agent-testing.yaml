openapi: 3.0.3
info:
  title: TestMu AI Agent Testing API Documentation
  version: 1.0.0
  description: 'API reference for the Agent Testing product: create projects, author test scenarios, run
    phone/chat/voice agent tests, and retrieve results. Authentication uses your LambdaTest username and
    access key.'
servers:
- url: https://agent-testing.lambdatest.com
paths:
  /api/health:
    get:
      tags:
      - Platform
      summary: Health Check
      operationId: health_check_api_health_get
      responses:
        '200':
          description: Service liveness, initialization state and upload limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelopeDoc'
  /api/projects:
    get:
      tags:
      - Projects
      summary: Get Agent Projects
      description: Get all agent projects for the current organization.
      operationId: get_agent_projects_api_projects_get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 999
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
    post:
      tags:
      - Projects
      summary: Create Agent Project
      description: Create a new agent project.
      operationId: create_agent_project_api_projects_post
      security:
      - BearerAuth: []
      - HTTPBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}:
    put:
      tags:
      - Projects
      summary: Update Agent Project
      description: Update an existing agent project.
      operationId: update_agent_project_api_projects__project_id__put
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
    delete:
      tags:
      - Projects
      summary: Delete Project
      description: Delete a project and all its related data.
      operationId: delete_project_api_projects__project_id__delete
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Deletion acknowledgement; data is always null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDeletedEnvelopeDoc'
        '404':
          description: Project not found
          content:
            application/json:
              example:
                detail: Not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/workflows:
    get:
      tags:
      - Projects
      summary: Get Project Workflows
      description: Get all workflow IDs for a project.
      operationId: get_project_workflows_api_projects__project_id__workflows_get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: BaseResponse envelope; data.workflows lists workflow summaries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWorkflowsEnvelopeDoc'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/agent-profiles:
    get:
      tags:
      - Agent Profiles
      summary: Get Agent Profiles
      description: Get all agent profiles for the organization.
      operationId: get_agent_profiles_api_agent_profiles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileListResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
    post:
      tags:
      - Agent Profiles
      summary: Create Agent Profile
      description: Create a new agent profile.
      operationId: create_agent_profile_api_agent_profiles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
    delete:
      tags:
      - Agent Profiles
      summary: Delete Agent Profiles
      description: 'Delete agent profiles.


        Note: this endpoint takes no path parameter — the profile ids to delete

        are passed in the request body.'
      operationId: delete_agent_profiles_api_agent_profiles_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
  /api/agent-profiles/{profile_id}:
    put:
      tags:
      - Agent Profiles
      summary: Update Agent Profile
      description: Update an existing agent profile.
      operationId: update_agent_profile_api_agent_profiles__profile_id__put
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/phone-scenarios/generate:
    post:
      tags:
      - Phone Testing
      summary: Generate Phone Scenarios
      description: 'Generate phone test scenarios (inbound — the simulator calls the bot).


        Generation may run in the background; generated scenarios are saved

        automatically. Poll GET /api/projects/{project_id}/phone-scenarios/saved

        to retrieve them, and delete any you don''t want to keep.'
      operationId: generate_phone_scenarios_api_projects__project_id__phone_scenarios_generate_post
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePhoneScenariosRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneScenarioResponse'
        '402':
          description: Insufficient credits for scenario generation
          content:
            application/json:
              example:
                detail: Insufficient credits.
        '403':
          description: Project not found or not accessible to the caller's organization
          content:
            application/json:
              example:
                detail: Access denied.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/phone-scenarios/saved:
    get:
      tags:
      - Phone Testing
      summary: Get Saved Phone Scenarios
      description: Get all saved phone scenarios for a project.
      operationId: get_saved_phone_scenarios_api_projects__project_id__phone_scenarios_saved_get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/phone-scenarios/create:
    post:
      tags:
      - Phone Testing
      summary: Create Phone Scenario
      description: Create a new phone scenario manually. Credits are charged for the LLM usage.
      operationId: create_phone_scenario_api_projects__project_id__phone_scenarios_create_post
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScenarioResponse'
        '402':
          description: Insufficient credits to create the scenario
          content:
            application/json:
              example:
                detail: Insufficient credits.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/phone-scenarios/edit:
    put:
      tags:
      - Phone Testing
      summary: Edit Phone Scenario
      description: Edit an existing phone scenario.
      operationId: edit_phone_scenario_api_projects__project_id__phone_scenarios_edit_put
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditScenarioRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditScenarioResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/projects/{project_id}/phone-scenarios/delete:
    delete:
      tags:
      - Phone Testing
      summary: Delete Phone Scenarios
      description: Delete phone scenarios for a project.
      operationId: delete_phone_scenarios_api_projects__project_id__phone_scenarios_delete_delete
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteScenarioRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/suites:
    post:
      tags:
      - Phone Testing
      summary: Create Suite
      description: Create a new suite.
      operationId: create_suite_api_suites_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuiteCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
  /api/suites/{project_id}:
    get:
      tags:
      - Phone Testing
      summary: Get Suites By Project
      description: 'Get all suites for a given project, optionally filtered by workflow_id.


        Note: the path parameter is a PROJECT id (this lists the project''s

        suites); suite-scoped operations take a suite id instead.'
      operationId: get_suites_by_project_api_suites__project_id__get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: workflow_id
        in: query
        required: false
        schema:
          description: Optional workflow ID to filter suites for chat agents
          title: Workflow Id
          type: string
          nullable: true
        description: Optional workflow ID to filter suites for chat agents
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/suites/{suite_id}/summary:
    get:
      tags:
      - Phone Testing
      summary: Get aggregated suite summary statistics
      description: Get aggregated summary statistics for a suite.
      operationId: get_suite_summary_api_suites__suite_id__summary_get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          title: Suite Id
      - name: days
        in: query
        required: false
        schema:
          description: Filter results by the last N days
          title: Days
          type: integer
          nullable: true
        description: Filter results by the last N days
      - name: start_date
        in: query
        required: false
        schema:
          description: Start date for custom range (ISO format)
          title: Start Date
          type: string
          nullable: true
        description: Start date for custom range (ISO format)
      - name: end_date
        in: query
        required: false
        schema:
          description: End date for custom range (ISO format)
          title: End Date
          type: string
          nullable: true
        description: End date for custom range (ISO format)
      - name: project_id
        in: query
        required: false
        schema:
          description: Project ID to validate suite ownership
          title: Project Id
          type: string
          nullable: true
        description: Project ID to validate suite ownership
      responses:
        '200':
          description: Read-only aggregates computed from stored call results. A suite with no results
            in range returns empty aggregates and omits the scenario-level and debug keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteSummaryDoc'
              example:
                suite_id: suite_8f2c1a
                suite_name: Order status regression
                total_calls: 24
                overall_stats:
                  pass_rate_percentage: 79.2
                  average_score: 84.1
                  passed: 19
                  failed: 3
                  needs_improvement: 2
                metrics_breakdown:
                  accuracy_effectiveness:
                    task_completion_success_rate_percentage: 88.4
                  user_experience:
                    csat_customer_satisfaction_percentage: 81.0
                issue_tags_summary:
                - tag: long_silence
                  count: 4
                improvement_areas:
                - category: user_experience
                  metric: csat_customer_satisfaction_percentage
                  threshold: 85
                  current_value: 81.0
                  severity: medium
                  total_affected_scenarios: 2
                call_details:
                  status_breakdown:
                    passed: 19
                    failed: 3
                    needs_improvement: 2
                  duration_stats:
                    average_seconds: 96.4
                    min_seconds: 41.2
                    max_seconds: 210.8
        '404':
          description: Suite not found, not accessible, or not in the specified project
          content:
            application/json:
              example:
                detail: Not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
  /api/initiatecall:
    post:
      tags:
      - Phone Testing
      summary: Initiate phone calls for scenarios
      description: Initiate phone calls for given scenarios.
      operationId: initiate_call_api_initiatecall_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateCallRequest'
        required: true
      responses:
        '200':
          description: Calls dispatched (or enqueued for suite triggers). `data` carries the per-scenario
            `call_ids`; suite triggers additionally include `suite_run_id`, `total`, `started`, and `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateCallResponse'
        '400':
          description: Invalid request (unknown scenarios, bad matrix configuration, etc.)
          content:
            application/json:
              example:
                detail: Invalid request (unknown scenarios, bad matrix configuration, etc.).
        '402':
          description: Insufficient credits to place the requested calls
          content:
            application/json:
              example:
                detail: Insufficient credits.
        '403':
          description: Project or suite not found in this organization
          content:
            application/json:
              example:
                detail: Access denied.
        '409':
          description: Parallel-call cap reached for a single-call (non-suite) trigger
          content:
            application/json:
              example:
                detail: Parallel-call cap reached for a single-call (non-suite) trigger.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail: Validation Error.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
  /api/initiatecall/project:
    post:
      tags:
      - Phone Testing
      summary: Initiate calls for a suite by name
      description: 'Initiate phone calls for every scenario in a named suite.


        Send a JSON body with ``project_id`` and ``suite_name``; the suite''s

        scenarios are dialed and results appear under the suite''s call results.'
      operationId: initiate_call_by_suite_api_initiatecall_project_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                project_id:
                  type: string
                  description: Project the suite belongs to
                suite_name:
                  type: string
                  description: Name of the suite whose scenarios should be dialed
              type: object
              required:
              - project_id
              - suite_name
            example:
              project_id: 3f2b8c1a-9d64-4e07-b5a2-8c1f6d093e47
              suite_name: Regression Suite
        required: true
      responses:
        '200':
          description: Calls initiated — data carries the per-scenario call_ids; suite triggers additionally
            include suite_run_id, total, started, and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateCallResponse'
        '400':
          description: project_id and suite_name are required (or the suite has no scenarios configured)
          content:
            application/json:
              example:
                detail: project_id and suite_name are required (or the suite has no scenarios configured).
        '402':
          description: Insufficient credits to place the requested calls
          content:
            application/json:
              example:
                detail: Insufficient credits.
        '404':
          description: Suite not found with that name in the project
          content:
            application/json:
              example:
                detail: Not found.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Missing or invalid credentials.
      security:
      - BearerAuth: []
      - HTTPBasic: []
  /api/callresults/{suite_id}:
    get:
      tags:
      - Phone Testing
      summary: Get all call results for a suite
      description: Get all call results for a suite.
      operationId: get_suite_call_results_api_callresults__suite_id__get
      security:
      - BearerAuth: []
      - HTTPBasic: []
      parameters:
      - name: suite_id
        in: path
        required: true
