    PhoneScenario:
      properties:
        scenario_id:
          title: Scenario Id
          description: Unique identifier for the scenario
          type: string
          nullable: true
        scenario:
          type: string
          title: Scenario
          description: The name or title of the scenario
        prompt:
          type: string
          title: Prompt
          description: The detailed simulator bot prompt for the scenario (generic with {placeholders})
        description:
          type: string
          title: Description
          description: A brief description of what the scenario is testing (generic, no hardcoded test
            data)
        persona:
          type: string
          title: Persona
          description: The persona used in this scenario
          default: ''
        expected_output:
          items:
            type: string
          type: array
          title: Expected Output
          description: 'DEPRECATED: legacy validation criteria templates with {placeholders}. New writers
            should populate `success_criteria` instead. Readers consult `success_criteria` first and fall
            back to this field only if it is unset (None). An explicit empty list on `success_criteria`
            is honored as ''no criteria'' and does NOT fall through. Writes to `expected_output` alone
            are automatically mirrored into `success_criteria` so the two fields stay in sync.'
          deprecated: true
          example:
          - Agent should greet {{caller_name}} appropriately
        success_criteria:
          title: Success Criteria
          description: Pass/fail validation criteria templates. Generated by a dedicated narrowly-scoped
            LLM call so the freeform `description` field cannot pollute grading. When set (including to
            an empty list) this field wins over the legacy `expected_output`. When None or absent, readers
            fall back to `expected_output`.
          example:
          - Agent should greet {{caller_name}} appropriately
          - Agent must verify {{account_id}} before disclosing balance
          - When asked for phone, agent should confirm {{phone_number}} matches records
          items:
            type: string
          type: array
          nullable: true
        required_test_fields:
          title: Required Test Fields
          description: List of required test data fields that must be provided at runtime
          items:
            $ref: '#/components/schemas/TestFieldSpec'
          type: array
          nullable: true
        optional_test_fields:
          title: Optional Test Fields
          description: List of optional test data fields that can be provided at runtime
          items:
            $ref: '#/components/schemas/TestFieldSpec'
          type: array
          nullable: true
        test_profile_id:
          title: Test Profile Id
          description: Optional test profile ID associated with this scenario
          type: string
          nullable: true
        agent_profile_id:
          title: Agent Profile Id
          description: Optional agent profile ID associated with this scenario
          type: string
          nullable: true
        reservation_enabled:
          title: Reservation Enabled
          description: Whether this scenario reserves a dedicated phone number
          default: false
          type: boolean
          nullable: true
        max_duration_seconds:
          title: Max Duration Seconds
          description: Maximum call duration in seconds (60-3600). Defaults to 500 if not set.
          type: integer
          nullable: true
        silence_timeout_seconds:
          title: Silence Timeout Seconds
          description: Whole-call silence cap in seconds (30-180). The call is ended if neither party
            speaks for this long. Distinct from wait_seconds (per-turn endpointing delay). Defaults to
            30s if not set.
          type: integer
          maximum: 180.0
          minimum: 30.0
          nullable: true
        needs_dtmf:
          title: Needs Dtmf
          description: Whether this scenario requires DTMF tool for IVR navigation
          type: boolean
          nullable: true
        dtmf_instructions:
          title: Dtmf Instructions
          description: User-provided IVR navigation instructions injected verbatim into the prompt when
            needs_dtmf is true
          type: string
          nullable: true
        needs_human_transfer:
          title: Needs Human Transfer
          description: Enable for scenarios where the agent under test transfers the call to a human.
            The simulator waits silently for the human to pick up and continues the conversation with
            them, instead of ending the call on the transfer.
          type: boolean
          nullable: true
        languages:
          title: Languages
          description: Languages for this scenario (e.g. ['English', 'Hindi']). Defaults to ['English']
            if not set.
          items:
            type: string
          type: array
          nullable: true
        ivr_workflow:
          title: Ivr Workflow
          description: 'IVR-only: the scenario''s deterministic workflow — an ordered list of steps plus
            a small nodes/edges graph — rendered as the ''Workflow View'' on the scenario detail page.
            Built at generation time during scenario generation. None for non-IVR.'
          additionalProperties: true
          type: object
          nullable: true
        vapi_enabled_tool_ids:
          title: Vapi Enabled Tool Ids
          description: VAPI assistant tool IDs enabled for this scenario.
          items:
            type: string
          type: array
          nullable: true
        vapi_tool_steps:
          title: Vapi Tool Steps
          description: Scenario instructions for triggering the selected VAPI tools of the agent under
            test.
          items:
            $ref: '#/components/schemas/VAPIToolStep'
          type: array
          nullable: true
      type: object
      required:
      - scenario
      - prompt
      - description
      title: PhoneScenario
      description: Model for a phone test scenario.
    PhoneScenarioIdItem:
      properties:
        scenario_id:
