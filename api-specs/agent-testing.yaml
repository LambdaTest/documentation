          type: integer
          title: Fallback Agent Response Samples
          default: 0
        agent_response_latency_reliable:
          type: boolean
          title: Agent Response Latency Reliable
          default: false
        success_rate:
          type: number
          title: Success Rate
          default: 0.0
        drop_rate:
          type: number
          title: Drop Rate
          default: 0.0
        error_distribution:
          additionalProperties:
            type: integer
          type: object
          title: Error Distribution
        avg_queue_wait_ms:
          title: Avg Queue Wait Ms
          type: number
          nullable: true
        stuck_call_count:
          type: integer
          title: Stuck Call Count
          default: 0
        avg_call_duration_s:
