          title: Ramp Step Interval Seconds
          description: Seconds to wait between ramp steps before adding more load. Set to 0 when pacing
            is driven entirely by ``cooldown_between_calls_ms`` (e.g. when scheduling a fixed calls-per-second
            rate).
          default: 30
        sustained_duration_minutes:
          type: integer
          maximum: 120.0
          minimum: 1.0
          title: Sustained Duration Minutes
          description: How long to hold max_concurrency once reached (sustained / spike).
          default: 5
        cooldown_between_calls_ms:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Cooldown Between Calls Ms
          description: Milliseconds to stagger individual dials within a single step so provider create-call
            requests don't arrive simultaneously.
          default: 500
      type: object
      required:
      - project_id
      title: PerformanceTestStartRequest
      description: "Body for ``POST /api/performance-tests/start``.\n\nThe presence of this body — at\
        \ this endpoint — is what tells the\nbackend a load test is in progress. There is no ``load_test``\
        \ flag on\nthe standard call-initiation request, and the standard request will\nnever accept these\
        \ pacing fields. Separation is by URL, not flag.\n\nTwo mutually-exclusive request modes:\n\n\
        1. **Suite-driven** (preferred, used by the UI):\n   Set ``source_suite_id`` + ``concurrent_calls``.\
        \ The orchestrator\n   loads the suite, expands its matrix into combos, and round-robins\n   ``concurrent_calls``\
        \ dials across them. The suite's ``iterations``\n   field is intentionally overridden — ``concurrent_calls``\
        \ IS the\n   dial count for the run.\n\n2. **Ad-hoc scenarios** (kept for CLI/API users):\n  \
        \ Set ``scenario_ids`` (+ optional ``scenarios`` matrix overrides).\n   Behaves like the original\
        \ perf API — orchestrator paces these\n   through whatever ``profile`` is selected.\n\nExactly\
        \ one of the two modes must be provided."
    PerformanceTestStartResponse:
      properties:
        perf_test_run_id:
          type: string
          title: Perf Test Run Id
        suite_id:
          title: Suite Id
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/PerformanceTestRunStatus'
          default: running
        profile:
          $ref: '#/components/schemas/PerformanceTestProfile'
        max_concurrency:
          type: integer
          title: Max Concurrency
        message:
          type: string
          title: Message
      type: object
      required:
      - perf_test_run_id
      - profile
      - max_concurrency
      - message
      title: PerformanceTestStartResponse
      description: Reply from ``POST /api/performance-tests/start``.
    PerformanceTestSummary:
