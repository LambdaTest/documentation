        provider_error_rate:
          type: number
          title: Provider Error Rate
          default: 0.0
        avg_cost_usd:
          title: Avg Cost Usd
          type: number
          nullable: true
      type: object
      required:
      - concurrency_level
      - calls
      title: ConcurrencyBandStats
      description: 'Tier 1 metric block for one concurrency band.


        A "band" is the set of calls that ran at a given concurrency level —

        bucketed into a range (1, 2-5, 6-10, ...), not one band per exact value,

        so each band aggregates enough calls to stay reliable at any scale.

        Bucketing by concurrency is what surfaces the degradation curve;

        everything else in this object is the per-band aggregate the frontend

        renders.'
